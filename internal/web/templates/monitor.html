{{define "monitor.html"}}
<section class="account-toolbar" aria-label="实时监控操作">
  <div class="account-toolbar-summary">
    <span><strong data-monitor-rule-count>—</strong> 条启用规则</span>
    <span><strong data-monitor-pending-count>—</strong> 条待处理告警</span>
  </div>
  <div class="heading-actions">
    <button class="button button-secondary" type="button" data-monitor-run>
      <span class="icon icon-refresh-cw" aria-hidden="true"></span>
      立即运行
    </button>
    <a class="button button-primary" href="/monitor/tasks">
      <span class="icon icon-radio-tower" aria-hidden="true"></span>
      新建监控
    </a>
  </div>
</section>

<div class="business-overview-grid">
  <section class="card">
    <div class="card-header">
      <h2>调度状态</h2>
      <span class="badge badge-neutral" data-monitor-state>读取中</span>
    </div>
    <dl class="info-list">
      <div><dt>上次开始</dt><dd data-monitor-started>—</dd></div>
      <div><dt>上次完成</dt><dd data-monitor-finished>—</dd></div>
      <div><dt>最近错误</dt><dd data-monitor-error>—</dd></div>
    </dl>
  </section>
  <section class="card">
    <div class="card-header">
      <h2>最新告警</h2>
      <a class="text-link" href="/monitor/alerts">全部告警</a>
    </div>
    <div class="business-compact-list" data-monitor-alerts>
      <p class="business-empty-copy">正在读取告警...</p>
    </div>
  </section>
</div>

<section class="card">
  <div class="card-header">
    <h2>运行中的规则</h2>
    <a class="text-link" href="/monitor/tasks">管理监控任务</a>
  </div>
  <div class="business-table-wrap" data-monitor-rules-wrap hidden>
    <table class="business-table">
      <thead><tr><th>规则</th><th>账号</th><th>来源</th><th>关键词</th><th>最近运行</th><th>状态</th></tr></thead>
      <tbody data-monitor-rules-body></tbody>
    </table>
  </div>
  <div class="empty-state compact" data-monitor-rules-empty>
    <span class="empty-icon"><span class="icon icon-radio-tower" aria-hidden="true"></span></span>
    <h2>没有启用的规则</h2>
    <p>创建规则后，调度器会按分钟读取目标会话的新消息。</p>
    <a class="button button-primary" href="/monitor/tasks">创建监控规则</a>
  </div>
  <p class="form-notice form-notice-error" data-monitor-notice hidden></p>
</section>

<div class="account-toast" data-business-toast role="status" aria-live="polite" hidden></div>
{{end}}
