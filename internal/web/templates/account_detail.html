{{define "account_detail.html"}}
<section class="account-detail-toolbar" data-account-detail data-account-id="{{.AccountID}}" data-account-workspace="{{if eq .Page "account-web"}}true{{else}}false{{end}}">
  <div class="account-detail-identity">
    <span class="account-avatar-fallback" data-detail-avatar aria-hidden="true">TG</span>
    <span>
      <strong data-detail-name>正在加载账号...</strong>
      <small data-detail-meta>正在加载账号信息...</small>
    </span>
  </div>
  <div class="heading-actions">
    <a class="button button-secondary" href="/accounts">
      <span class="icon icon-chevron-down back-icon" aria-hidden="true"></span>
      返回账号列表
    </a>
    <button class="button button-primary" type="button" data-chats-refresh>
      <span class="icon icon-refresh-cw" aria-hidden="true"></span>
      刷新聊天
    </button>
  </div>
</section>

<section class="account-offline-state" data-account-offline hidden>
  <span class="empty-icon"><span class="icon icon-radio-tower" aria-hidden="true"></span></span>
  <h2>账号当前已掉线</h2>
  <p data-account-offline-copy>该账号的 Telegram 授权已失效，无法读取实时聊天。</p>
  <a class="button button-primary" href="/accounts">
    <span class="icon icon-arrow-left" aria-hidden="true"></span>
    返回账号列表重新登录
  </a>
</section>

<div class="chat-workspace">
  <section class="card chat-sidebar-card" aria-label="聊天列表">
    <div class="card-header">
      <div>
        <h2>会话列表</h2>
        <span class="muted" data-chat-count>正在读取...</span>
      </div>
      <span class="icon icon-messages-square chat-section-icon" aria-hidden="true"></span>
    </div>
    <div class="chat-list-state" data-chats-loading>
      <span class="table-spinner" aria-hidden="true"></span>
      <p>正在从 Telegram 读取聊天...</p>
    </div>
    <div class="chat-list" data-chat-list hidden></div>
    <p class="form-notice form-notice-error" data-chats-error hidden></p>
  </section>

  <section class="card conversation-card" aria-label="聊天记录">
    <div class="conversation-empty" data-messages-empty>
      <span class="empty-icon"><span class="icon icon-message-square-text" aria-hidden="true"></span></span>
      <h2>选择一个聊天</h2>
      <p>点击左侧会话，查看最近消息和更早记录。</p>
    </div>
    <div data-conversation hidden>
      <div class="conversation-header">
        <div>
          <h2 data-conversation-title>聊天</h2>
          <span class="muted" data-conversation-meta></span>
        </div>
        <span class="badge badge-blue" data-conversation-type>Telegram</span>
      </div>
      <div class="message-list" data-message-list></div>
      <div class="message-actions">
        <button class="button button-secondary" type="button" data-load-older hidden>
          <span class="icon icon-refresh-cw" aria-hidden="true"></span>
          加载更早消息
        </button>
        <span class="table-spinner" data-messages-loading hidden aria-label="正在加载消息"></span>
        <p class="form-notice form-notice-error" data-messages-error hidden></p>
      </div>
    </div>
  </section>
</div>
{{end}}
