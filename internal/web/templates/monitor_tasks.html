{{define "monitor_tasks.html"}}
<section class="account-toolbar" aria-label="监控任务操作">
  <div class="account-toolbar-summary">
    <span><strong data-task-count>—</strong> 条规则</span>
    <span><strong data-task-enabled-count>—</strong> 条启用</span>
  </div>
  <div class="heading-actions">
    <button class="button button-secondary" type="button" data-channel-create>
      <span class="icon icon-bell-ring" aria-hidden="true"></span>
      添加通知渠道
    </button>
    <button class="button button-primary" type="button" data-task-create>
      <span class="icon icon-radio-tower" aria-hidden="true"></span>
      新建规则
    </button>
  </div>
</section>

<section class="card" data-channel-list>
  <div class="card-header">
    <div>
      <h2>通知渠道</h2>
      <p>Webhook 地址与签名密钥保存后不会再次显示。</p>
    </div>
    <span class="badge badge-neutral"><strong data-channel-count>—</strong> 个渠道</span>
  </div>
  <div class="business-table-wrap">
    <table class="business-table">
      <thead><tr><th>渠道</th><th>类型</th><th>状态</th><th>创建于</th><th>操作</th></tr></thead>
      <tbody data-channel-list-body></tbody>
    </table>
  </div>
  <p class="form-notice form-notice-error" data-channel-list-error hidden></p>
</section>

<section class="card">
  <div class="business-table-wrap" data-tasks-wrap hidden>
    <table class="business-table">
      <thead><tr><th>规则</th><th>监听取话</th><th>关键词</th><th>通知渠道</th><th>更新于</th><th>状态</th><th>操作</th></tr></thead>
      <tbody data-tasks-body></tbody>
    </table>
  </div>
  <div class="empty-state compact" data-tasks-empty>
    <span class="empty-icon"><span class="icon icon-clipboard-list" aria-hidden="true"></span></span>
    <h2>还没有监控规则</h2>
    <p>选择账号、会话和关键词后，系统会按分钟读取新消息。</p>
    <button class="button button-primary" type="button" data-task-create>创建第一条规则</button>
  </div>
  <p class="form-notice form-notice-error" data-tasks-error hidden></p>
</section>

<dialog class="account-dialog business-dialog" id="monitor-rule-dialog" aria-labelledby="monitor-rule-title">
  <form class="dialog-card" data-monitor-rule-form>
    <div class="dialog-header">
      <div>
        <p class="eyebrow">监控规则</p>
        <h2 id="monitor-rule-title" data-rule-dialog-title>新建规则</h2>
      </div>
      <button class="tool-button" type="button" data-monitor-rule-close aria-label="关闭监控规则">
        <span class="icon icon-x" aria-hidden="true"></span>
      </button>
    </div>
    <label class="field">
      <span>规则名称</span>
      <input name="name" type="text" maxlength="60" required>
    </label>
    <label class="field">
      <span>Telegram 账号</span>
      <select name="account_id" data-monitor-account required></select>
    </label>
    <label class="field">
      <span>监听取话</span>
      <select name="chat" data-monitor-chat required disabled>
        <option value="">请先选择在线账号</option>
      </select>
    </label>
    <label class="field">
      <span>关键词</span>
      <textarea name="keywords" rows="3" maxlength="1000" placeholder="每行一个关键词；留空表示该会话的全部新消息"></textarea>
      <small class="field-hint">监控命中后生成告警；留空时告警匹配关键词为空。</small>
    </label>
    <label class="field">
      <span>排除词</span>
      <textarea name="exclude_keywords" rows="2" maxlength="1000" placeholder="每行一个排除词；命中后不会生成告警"></textarea>
      <small class="field-hint">排除词不区分大小写，不能与关键词重复。</small>
    </label>
    <label class="field">
      <span>责任人</span>
      <input name="owner" type="text" maxlength="64" required
        placeholder="规则维护人员或团队">
    </label>
    <label class="field">
      <span>告警冷却</span>
      <input name="cooldown_seconds" type="number" min="0" max="86400" step="30" value="0">
      <small class="field-hint">单位秒；设置为 0 表示不限制。冷却只抑制重复告警，不会跳过采集。</small>
    </label>
    <label class="field">
      <span>通知渠道</span>
      <select name="notification_channel_id" data-monitor-channel required>
        <option value="1">站内通知</option>
      </select>
      <small class="field-hint">站内通知即时可见；Webhook 由后台排队发送并记录重试结果。</small>
    </label>
    <div class="rule-preview-block">
      <button class="button button-secondary button-compact" type="button" data-rule-preview>
        <span class="icon icon-search" aria-hidden="true"></span>
        预览最近消息命中
      </button>
      <div class="rule-preview-results" data-rule-preview-results hidden>
        <strong data-rule-preview-summary>尚未预览</strong>
        <div data-rule-preview-samples></div>
      </div>
    </div>
    <p class="form-notice" data-monitor-rule-notice hidden></p>
    <div class="dialog-actions">
      <button class="button button-secondary" type="button" data-monitor-rule-close>取消</button>
      <button class="button button-primary" type="submit">创建规则</button>
    </div>
  </form>
</dialog>

<dialog class="account-dialog business-dialog" id="monitor-rule-history-dialog"
  aria-labelledby="monitor-rule-history-title">
  <div class="dialog-card">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">规则版本</p>
        <h2 id="monitor-rule-history-title">版本历史</h2>
      </div>
      <button class="tool-button" type="button" data-rule-history-close
        aria-label="关闭规则版本历史">
        <span class="icon icon-x" aria-hidden="true"></span>
      </button>
    </div>
    <div class="rule-version-list" data-rule-version-list></div>
    <p class="form-notice form-notice-error" data-rule-history-error hidden></p>
  </div>
</dialog>

<dialog class="account-dialog business-dialog" id="notification-channel-dialog"
  aria-labelledby="notification-channel-title">
  <form class="dialog-card" data-notification-channel-form>
    <div class="dialog-header">
      <div>
        <p class="eyebrow">告警投递</p>
        <h2 id="notification-channel-title">添加 Webhook 渠道</h2>
      </div>
      <button class="tool-button" type="button" data-notification-channel-close
        aria-label="关闭通知渠道">
        <span class="icon icon-x" aria-hidden="true"></span>
      </button>
    </div>
    <label class="field">
      <span>渠道名称</span>
      <input name="name" type="text" maxlength="60" required placeholder="例如：安全值班 Webhook">
    </label>
    <label class="field">
      <span>Webhook 地址</span>
      <input name="url" type="url" maxlength="2048" required
        placeholder="https://example.com/telenexus/alerts">
      <small class="field-hint">生产环境仅允许 HTTPS 公网地址；地址保存后不会回显。</small>
    </label>
    <label class="field">
      <span>HMAC 签名密钥</span>
      <input name="secret" type="password" minlength="16" maxlength="128"
        autocomplete="new-password" placeholder="可选，至少 16 个字符">
      <small class="field-hint">签名通过 X-TeleNexus-Signature 发送，密钥不会回显。</small>
    </label>
    <p class="form-notice" data-notification-channel-notice hidden></p>
    <div class="dialog-actions">
      <button class="button button-secondary" type="button"
        data-notification-channel-close>取消</button>
      <button class="button button-primary" type="submit">添加渠道</button>
    </div>
  </form>
</dialog>

<div class="account-toast" data-business-toast role="status" aria-live="polite" hidden></div>
{{end}}
