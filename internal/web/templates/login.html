{{define "login.html"}}
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · TeleNexus</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-brand" aria-label="TeleNexus 简介">
        <div class="login-brand-content">
          <a class="login-logo" href="/"><img src="/static/img/logo.svg" alt=""><span>TeleNexus</span></a>
          <h1>在一个控制台中<br>管理所有 Telegram 账号。</h1>
          <p>集中管理账号、配置监控规则，并为后续消息采集与告警预留可扩展的后台框架。</p>
          <div class="login-features">
            <span>多账号管理</span><span>实时监控</span><span>统一告警</span>
          </div>
        </div>
        <p class="login-copyright">TeleNexus · Go control plane</p>
      </section>
      <section class="login-form-area">
        <div class="login-card">
          <div class="login-intro">
            <p class="eyebrow">管理控制台</p>
            <h2 data-login-heading>正在检查管理员配置</h2>
            <p data-login-description>请稍候。</p>
          </div>
          <form class="login-form" data-login-form>
            <label class="field"><span>管理员账号</span><input name="username" type="text"
              autocomplete="username" minlength="3" maxlength="64" required
              placeholder="请输入管理员账号"></label>
            <label class="field"><span>密码</span><input name="password" type="password"
              autocomplete="current-password" minlength="12" maxlength="128" required
              placeholder="请输入管理员密码"></label>
            <p class="field-hint" data-setup-hint hidden>首次使用需设置至少 12 位的管理员密码。</p>
            <button class="button button-primary login-submit" type="submit" disabled>继续</button>
            <p class="form-notice" data-login-notice hidden></p>
          </form>
          <p class="login-copyright">管理员凭据仅保存在本机，密码以 bcrypt 哈希形式存储。</p>
        </div>
      </section>
    </main>
  </body>
</html>
{{end}}
