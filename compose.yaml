services:
  telenexus:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      LOG_LEVEL: info
      DATABASE_PATH: /data/telenexus.db
      SHUTDOWN_TIMEOUT: 10s
    volumes:
      - telenexus-data:/data
    restart: unless-stopped

volumes:
  telenexus-data:
