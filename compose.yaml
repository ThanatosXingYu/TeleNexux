services:
  telenexus:
    build: .
    ports:
      - "127.0.0.1:9487:9487"
    environment:
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:9487
      LOG_LEVEL: info
      DATABASE_PATH: /data/telenexus.db
      SHUTDOWN_TIMEOUT: 10s
    volumes:
      - telenexus-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped

volumes:
  telenexus-data:
